name: Build Android

# Release APK of the DisplayXR fork (org.displayxr.dolphin), arm64 only.
#
# Pushes to the displayxr branch, pull requests and manual runs build the release APK and keep it
# as a workflow artifact. A v* tag also signs it and attaches it to the GitHub Release for that tag.
#
# Signing comes from repository secrets; no keystore lives in the repository:
#   ANDROID_KEYSTORE_BASE64  ANDROID_KEYSTORE_PASSWORD  ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD
# Without them (a fork of this fork, or before they are added) the build produces an unsigned APK
# and publishes nothing, so it never fails for want of the key.
#
# Upstream Dolphin builds on its own buildbot and ships no GitHub workflows, so nothing else runs
# here.

on:
  push:
    branches:
      - displayxr
    tags:
      - 'v*'
  pull_request:
    branches:
      - displayxr
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  BuildApk:
    name: Build Android (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: versionCode counts commits (Source/Android/app/build.gradle.kts).
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake --version
          # The build asks for CMake 3.25 or newer; use the runner's own.
          echo "cmake.dir=$(dirname "$(dirname "$(command -v cmake)")")" >> Source/Android/local.properties
          cat Source/Android/local.properties

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: Source/Android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ARGS=(assembleRelease --no-daemon -PabiOnly=arm64-v8a)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ARGS+=("-PversionNameOverride=$GITHUB_REF_NAME")
          fi
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            # Dolphin's build reads these properties (signingConfigs.release).
            ARGS+=("-Pkeystore=$ANDROID_KEYSTORE_FILE" "-Pstorepass=$ANDROID_KEYSTORE_PASSWORD"
                   "-Pkeyalias=$ANDROID_KEY_ALIAS" "-Pkeypass=$ANDROID_KEY_PASSWORD")
          fi
          ./gradlew "${ARGS[@]}"

      - name: Check the APK
        run: |
          set -euo pipefail
          APK=$(find Source/Android/app/build/outputs/apk/release Source/Android/app/build/intermediates/apk/release -name '*.apk' 2>/dev/null | head -1)
          [ -n "$APK" ] || { echo "::error::no release APK"; exit 1; }
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$AAPT2" dump badging "$APK")
          pkg=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          vname=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          vcode=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          echo "APK: $APK package=$pkg versionCode=$vcode versionName=$vname"
          [ "$pkg" = "org.displayxr.dolphin" ] || { echo "::error::package is '$pkg'"; exit 1; }
          case "$vcode" in ''|*[!0-9]*) echo "::error::versionCode '$vcode'"; exit 1 ;; esac
          [ "$vcode" -gt 1 ] || { echo "::error::versionCode $vcode <= 1"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$vname" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME built versionName '$vname'"; exit 1
          fi
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmain.so' || { echo "::error::libmain.so missing"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libopenxr_loader.so' || { echo "::error::OpenXR loader missing"; exit 1; }
          if unzip -l "$APK" | grep -q ' lib/x86'; then echo "::error::APK carries x86 libraries"; exit 1; fi
          if [ "$HAS_KEYSTORE" = "true" ]; then
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --print-certs "$APK"
          fi

      - name: Stage the APK with a release name
        run: |
          VER="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="dev-${GITHUB_SHA::8}"
          SUFFIX=""
          [ "$HAS_KEYSTORE" = "true" ] || SUFFIX="-unsigned"
          APK=$(find Source/Android/app/build/outputs/apk/release Source/Android/app/build/intermediates/apk/release -name '*.apk' 2>/dev/null | head -1)
          mkdir -p out
          cp "$APK" "out/Dolphin3D-DisplayXR-${VER}-arm64${SUFFIX}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin3D-DisplayXR-apk
          path: out/*.apk

      # Only a signed APK is ever attached to a release.
      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: out/Dolphin3D-DisplayXR-*.apk
          fail_on_unmatched_files: true
